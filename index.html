jor/minor quality."}},m7b5:{intervals:[0,3,6,10],label:{he:"חצי-דימיניש (m7♭5)",en:"Half-diminished (m7♭5)"},note:{he:'אקורד דימיניש + ספטימה קטנה — מתוח אך פחות "חד" מדימיניש 7 המלא.',en:"A diminished triad plus a minor 7th — tense, but less sharp than a full diminished 7th."}},dim7:{intervals:[0,3,6,9],label:{he:"דימיניש 7",en:"Diminished 7th"},note:{he:"שלושה טרצות קטנות ברצף (3+3+3) — סימטרי לגמרי, הצליל המתוח והלא-יציב ביותר.",en:"Three stacked minor thirds (3+3+3) — perfectly symmetrical, the tensest and most unstable sound here."}},power:{intervals:[0,7],label:{he:"פאוור קורד",en:"Power Chord (5)"},note:{he:`רק שורש וקווינטה (7) — אין טרצה בכלל, אז אי אפשר לדעת אם "היה" מז'ור או מינור.`,en:`Just root and fifth (7) — no third at all, so there's no way to tell if it "would have" been major or minor.`}},maj9:{intervals:[0,4,7,11,14],label:{he:"מז'ור 9",en:"Major 9th"},note:{he:"אקורד מז'ור 7 + נונה גדולה (14) — עוד יותר חולמני ורחב ממז'ור 7 פשוט.",en:"A major 7th chord plus a major 9th (14) — even dreamier and wider than a plain major 7th."}},min9:{intervals:[0,3,7,10,14],label:{he:"מינור 9",en:"Minor 9th"},note:{he:"אקורד מינור 7 + נונה גדולה (14) — רך ועגול, נפוץ מאוד בנשמה ובניאו-סול.",en:"A minor 7th chord plus a major 9th (14) — soft and round, very common in soul and neo-soul."}},dom9:{intervals:[0,4,7,10,14],label:{he:"דומיננטית 9",en:"Dominant 9th"},note:{he:"אקורד דומיננטי 7 + נונה גדולה (14) — אותה דחיפה לטוניקה, רק עשיר יותר.",en:"A dominant 7th chord plus a major 9th (14) — the same pull to the tonic, just richer."}},dom7b5:{intervals:[0,4,6,10],label:{he:"7♭5",en:"7♭5"},note:{he:'אקורד דומיננטי עם קווינטה מוקטנת (6) במקום זכה — צליל דומיננטי "משוטח" וסימטרי יותר.',en:"A dominant chord with a flat fifth (6) instead of a perfect one — a flatter, more symmetrical dominant sound."}},dom7s5:{intervals:[0,4,8,10],label:{he:"7♯5",en:"7♯5"},note:{he:`אקורד דומיננטי עם קווינטה מוגדלת (8) — צליל "משתנה" ומתוח, נפוץ בג'אז לפני נחיתה על אקורד מינורי.`,en:'A dom 	/**
	 * A multichannel buffer for use within an AudioWorkletProcessor as a delay line
	 */
	class DelayLine {
		
		constructor(size, channels) {
			this.buffer = [];
			this.writeHead = []
			this.size = size;

			// create the empty channels
			for (let i = 0; i < channels; i++) {
				this.buffer[i] = new Float32Array(this.size);
				this.writeHead[i] = 0;
			}
		}

		/**
		 * Push a value onto the end
		 * @param channel number
		 * @param value number
		 */
		push(channel, value) {
			this.writeHead[channel] += 1;
			if (this.writeHead[channel] > this.size) {
				this.writeHead[channel] = 0;
			}
			this.buffer[channel][this.writeHead[channel]] = value;
		}

		/**
		 * Get the recorded value of the channel given the delay
		 * @param channel number
		 * @param delay number delay samples
		 */
		get(channel, delay) {
			let readHead = this.writeHead[channel] - Math.floor(delay);
			if (readHead < 0) {
				readHead += this.size;
			}
			return this.buffer[channel][readHead];
		}
	}
